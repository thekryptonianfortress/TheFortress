name: record_linux
description: Patched record_linux stub — adds startStream + hasPermission({request}) stubs so Android builds compile with record_platform_interface >=1.5.0.
version: 0.7.3

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.0.0"

dependencies:
  flutter:
    sdk: flutter
  record_platform_interface: ">=1.0.2 <2.0.0"

flutter:
  plugin:
    implements: record
    platforms:
      linux:
        pluginClass: RecordLinuxPlugin
        dartPluginClass: RecordLinux
