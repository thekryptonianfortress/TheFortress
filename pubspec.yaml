name: pager
description: "Secure VoIP calling and messaging without a SIM carrier."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.8

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # WebRTC
  flutter_webrtc: ^1.5.1

  # Networking
  socket_io_client: ^2.0.3+1
  http: ^1.2.2

  # Local storage
  sqflite: ^2.3.3
  path: ^1.9.0
  shared_preferences: ^2.3.2
  flutter_secure_storage: ^9.2.2

  # State management
  provider: ^6.1.2

  # Push notifications
  firebase_core: ^3.3.0
  firebase_messaging: ^15.1.0
  flutter_local_notifications: ^17.2.2

  # Crypto / identity
  cryptography: ^2.7.0
  uuid: ^4.5.1

  # LAN discovery & advertising (mDNS)
  bonsoir: ^5.1.2

  # Permissions
  permission_handler: ^11.3.1

  # Utils
  intl: ^0.20.1

  # Media / attachments
  image_picker: ^1.1.2
  file_picker: ^8.1.4
  cached_network_image: ^3.4.1
  open_file: ^3.5.10
  path_provider: ^2.1.5
  mime: ^2.0.0
  video_player: ^2.9.2
  video_thumbnail: ^0.5.3

  # Voice notes
  record: 5.0.5
  just_audio: ^0.9.39

  # Backup
  archive: ^3.6.1
  share_plus: ^10.0.0

  # Connectivity
  connectivity_plus: ^6.0.0

  # URL launching
  url_launcher: ^6.3.0

dependency_overrides:
  # record_linux 0.7.2 doesn't implement startStream/hasPermission({request}) from record_platform_interface 1.5.0+
  # Use local patched version that adds stub implementations
  record_linux:
    path: packages/record_linux_patched

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "Appicon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#17212B"
  adaptive_icon_foreground: "Appicon.png"

flutter:
  uses-material-design: true
