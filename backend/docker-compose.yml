version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: pager_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: pager
      POSTGRES_USER: pager
      POSTGRES_PASSWORD: pager_pass
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pager"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: pager_app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://pager:pager_pass@postgres:5432/pager
      JWT_SECRET: ${JWT_SECRET:-change_me_in_production}
      PORT: 3000
      TURN_SECRET: ${TURN_SECRET:-pager_turn_secret}
      TURN_HOST: ${TURN_HOST:-10.152.224.130}
      TURN_PORT: ${TURN_PORT:-3478}
    ports:
      - "3000:3000"

  nginx:
    image: nginx:alpine
    container_name: pager_nginx
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro

  coturn:
    image: coturn/coturn:latest
    container_name: pager_coturn
    restart: unless-stopped
    ports:
      - "3478:3478/udp"
      - "3478:3478/tcp"
      - "49152-49200:49152-49200/udp"
    command: >
      -n --log-file stdout
      --listening-port 3478
      --external-ip 10.152.224.130
      --use-auth-secret
      --static-auth-secret ${TURN_SECRET:-pager_turn_secret}
      --min-port 49152
      --max-port 49200

volumes:
  postgres_data:
